<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Links</title>
  <meta name="description" content="Mere saare links, ek hi jagah">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #1f2937;
      --muted: #6b7280;
      --line: #eceef3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: var(--text);
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .rainbow-bar {
      height: 6px;
      background: linear-gradient(90deg, #ec4899, #f97316, #f59e0b, #10b981, #06b6d4, #3b82f6, #8b5cf6);
    }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 48px 16px 32px; }

    /* ---------- Header ---------- */
    header { text-align: center; margin-bottom: 36px; }
    h1 {
      font-size: clamp(2.3rem, 7vw, 3.8rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ec4899, #f97316, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { color: var(--muted); margin-top: 10px; font-size: 1.05rem; }

    .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .pill {
      font-size: .85rem; font-weight: 600;
      padding: 6px 14px; border-radius: 999px;
    }
    .pill.pink { background: #fdf2f8; color: #db2777; }
    .pill.blue { background: #eff6ff; color: #2563eb; }

    .search { position: relative; max-width: 540px; margin: 26px auto 0; }
    .search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #a78bfa; }
    .search input {
      width: 100%;
      padding: 14px 20px 14px 50px;
      border-radius: 999px;
      border: 2px solid var(--line);
      font: inherit; font-size: 1rem; color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 5px rgba(139, 92, 246, .14); }

    /* ---------- Columns ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      align-items: start;
    }
    .col {
      --c: #3b82f6;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 14px 30px -18px color-mix(in srgb, var(--c) 60%, transparent);
      animation: pop .45s ease both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(14px); } }

    .col-head {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 60%, #fff));
    }
    .col-head .icon { font-size: 1.35rem; }
    .col-head h2 { flex: 1; font-size: 1.12rem; font-weight: 700; }
    .count {
      background: rgba(255, 255, 255, .28);
      font-size: .8rem; font-weight: 600;
      padding: 2px 11px; border-radius: 999px;
    }

    .col ul { list-style: none; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .col li {
      display: flex; align-items: center;
      border-radius: 14px;
      border-left: 4px solid var(--c);
      background: color-mix(in srgb, var(--c) 7%, #fff);
      transition: transform .15s ease, background .15s ease;
    }
    .col li:hover { transform: translateX(4px); background: color-mix(in srgb, var(--c) 15%, #fff); }

    .item {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 6px 10px 12px;
      color: inherit; text-decoration: none;
    }
    .badge {
      position: relative;
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 10px;
      display: grid; place-items: center;
      background: var(--c); color: #fff;
      font-weight: 700; font-size: .95rem;
      overflow: hidden;
    }
    .badge img {
      position: absolute; inset: 0; margin: auto;
      width: 22px; height: 22px;
    }
    .badge.has-img { background: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, #fff); }
    .meta { min-width: 0; }
    .t { font-weight: 600; font-size: .96rem; line-height: 1.3; }
    .u {
      font-size: .78rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .copy {
      flex-shrink: 0;
      width: 36px; height: 36px; margin-right: 6px;
      border: 0; border-radius: 10px;
      background: transparent; color: var(--c);
      cursor: pointer;
      display: grid; place-items: center;
      transition: background .15s;
    }
    .copy:hover { background: #fff; }

    .empty { text-align: center; color: var(--muted); padding: 40px 0; display: none; }
    .empty.show { display: block; }

    footer {
      text-align: center; color: var(--muted); font-size: .88rem;
      padding: 36px 16px 44px;
    }
    footer a { color: #8b5cf6; font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .toast {
      position: fixed; left: 50%; bottom: 28px;
      transform: translate(-50%, 20px);
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: #fff; font-weight: 600; font-size: .9rem;
      padding: 10px 20px; border-radius: 999px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="rainbow-bar"></div>

  <div class="wrap">
    <header>
      <h1 id="title">My Links</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="stats">
        <span class="pill pink" id="stat-links"></span>
        <span class="pill blue" id="stat-cols"></span>
      </div>
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Link dhundho..." autocomplete="off" aria-label="Search links">
      </label>
    </header>

    <main class="grid" id="grid"></main>
    <p class="empty" id="empty">Koi link nahi mila 🙈</p>
  </div>

  <footer>
    Made with 💜 &nbsp;·&nbsp;
    <a href="https://github.com/anishraja04/my-links/edit/main/links.js" target="_blank" rel="noopener">✏️ Links add / edit karo</a>
  </footer>

  <div class="toast" id="toast">Link copy ho gaya ✅</div>

  <script src="links.js"></script>
  <script>
    const COLORS = ["#ec4899", "#f97316", "#10b981", "#3b82f6", "#8b5cf6", "#f59e0b", "#06b6d4", "#ef4444"];

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    function safeUrl(raw) {
      let url = String(raw || "").trim();
      if (!/^(https?:|mailto:|tel:)/i.test(url)) url = "https://" + url.replace(/^\/+/, "");
      try { return new URL(url); } catch { return null; }
    }

    function prettyUrl(u) {
      if (u.protocol === "mailto:" || u.protocol === "tel:") return u.href.replace(/^(mailto|tel):/, "");
      return (u.host + u.pathname + u.search).replace(/^www\./, "").replace(/\/$/, "");
    }

    const grid = document.getElementById("grid");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast() {
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function render() {
      document.title = SITE.title;
      document.getElementById("title").textContent = SITE.title;
      document.getElementById("subtitle").textContent = SITE.subtitle || "";

      let total = 0;
      COLUMNS.forEach((col, i) => {
        const section = el("section", "col");
        section.style.setProperty("--c", col.color || COLORS[i % COLORS.length]);
        section.style.animationDelay = i * 60 + "ms";

        const head = el("div", "col-head");
        head.append(el("span", "icon", col.icon || "🔗"), el("h2", null, col.name));
        const count = el("span", "count", (col.links || []).length);
        head.append(count);
        section.append(head);

        const list = el("ul");
        (col.links || []).forEach(link => {
          const u = safeUrl(link.url);
          if (!u) return;
          total++;

          const li = el("li");
          li.dataset.search = (link.title + " " + u.href + " " + col.name).toLowerCase();

          const a = el("a", "item");
          a.href = u.href;
          a.target = "_blank";
          a.rel = "noopener";

          const badge = el("span", "badge", (link.title || "?").trim().charAt(0).toUpperCase());
          if (u.protocol.startsWith("http")) {
            const img = new Image();
            img.alt = "";
            img.loading = "lazy";
            img.onload = () => { if (img.naturalWidth > 16) badge.classList.add("has-img"); else img.remove(); };
            img.onerror = () => img.remove();
            img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(u.hostname);
            badge.append(img);
          }

          const meta = el("span", "meta");
          meta.append(el("div", "t", link.title), el("div", "u", prettyUrl(u)));
          a.append(badge, meta);

          const copy = el("button", "copy");
          copy.type = "button";
          copy.title = "Copy link";
          copy.setAttribute("aria-label", "Copy " + link.title + " link");
          copy.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
          copy.addEventListener("click", async () => {
            try { await navigator.clipboard.writeText(u.href); showToast(); } catch { window.prompt("Copy this link:", u.href); }
          });

          li.append(a, copy);
          list.append(li);
        });
        section.append(list);
        grid.append(section);
      });

      document.getElementById("stat-links").textContent = total + " links";
      document.getElementById("stat-cols").textContent = COLUMNS.length + " columns";
    }

    function filter(q) {
      q = q.trim().toLowerCase();
      let shown = 0;
      grid.querySelectorAll(".col").forEach(col => {
        let n = 0;
        col.querySelectorAll("li").forEach(li => {
          const hit = !q || li.dataset.search.includes(q);
          li.style.display = hit ? "" : "none";
          if (hit) n++;
        });
        col.style.display = n ? "" : "none";
        col.querySelector(".count").textContent = n;
        shown += n;
      });
      document.getElementById("empty").classList.toggle("show", shown === 0);
    }

    render();
    document.getElementById("q").addEventListener("input", e => filter(e.target.value));
  </script>
</body>
</html>
